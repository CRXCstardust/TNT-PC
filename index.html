<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL to Iframe</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            user-select: none; /* Prevent text selection */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Prevent drag events */
        img, iframe {
            pointer-events: none;
        }

        /* Hide elements from screen readers */
        *:not(html):not(body):not(head):not(meta):not(title):not(link):not[aria-hidden="true"] {
            visibility: hidden !important;
        }
    </style>

    <script>
        // Disable Right-Click
        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });

        // Disable Keyboard Shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, etc.)
        document.addEventListener("keydown", function(event) {
            if (event.keyCode == 123 || 
                (event.ctrlKey && event.shiftKey && (event.keyCode == 73 || event.keyCode == 74)) || 
                (event.ctrlKey && event.keyCode == 85)) {
                event.preventDefault();
            }
        });

        // Detect DevTools Opened
        (function() {
            const element = new Image();
            Object.defineProperty(element, "id", {
                get: function() {
                    alert("DevTools Detected! Please close it.");
                    window.location.reload();
                }
            });
            console.log("%c", element);
        })();

        // Prevent Console Access
        setInterval(function() {
            if (window.outerHeight - window.innerHeight > 200 || window.outerWidth - window.innerWidth > 200) {
                alert("DevTools is open! Please close it.");
                window.close();
            }
        }, 1000);
    </script>

</head>
<body>

<iframe id="contentFrame" sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation" 
        frameborder="0" gesture="media" allow="encrypted-media" allowfullscreen="true" scrolling="no" 
        src="https://tnt1fhd.pages.dev"></iframe>

</body>
</html>
